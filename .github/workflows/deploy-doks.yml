name: Deploy to DOKS

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
    types: [closed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      academy: ${{ steps.filter.outputs.academy }}
      community: ${{ steps.filter.outputs.community }}
      identity: ${{ steps.filter.outputs.identity }}
      shared: ${{ steps.filter.outputs.shared }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: "csv"
          filters: |
            gateway:
              - 'Droniverse.Gateway/**'
            academy:
              - 'Droniverse.Academy/**'
            community:
              - 'Droniverse.Community/**'
            identity:
              - 'Droniverse.Identity/**'
            shared:
              - 'Droniverse.Shared/**'
            infra:
              - 'docker-compose/**'
              - '.github/workflows/**'

  build-push-rollout:
    runs-on: ubuntu-latest
    needs: detect-changes
    environment: DIGITAL OCEAN
    if: |
      (github.event_name == 'push' &&
       (github.ref_name == 'main' || github.ref_name == 'production')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
