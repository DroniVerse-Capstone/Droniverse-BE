apiVersion: apps/v1
kind: Deployment
metadata:
  name: droniverse-gateway
  namespace: droniverse-hostname
spec:
  replicas: 1
  selector:
    matchLabels:
      app: droniverse-gateway
  template:
    metadata:
      labels:
        app: droniverse-gateway
    spec:
      containers:
        - name: droniverse-gateway
          image: blackpro2k4/droniverse-gateway:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: droniverse-gateway
  namespace: droniverse-hostname
spec:
  selector:
    app: droniverse-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer