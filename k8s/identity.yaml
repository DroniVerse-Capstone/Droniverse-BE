apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-microservice
  namespace: droniverse-hostname
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-microservice
  template:
    metadata:
      labels:
        app: identity-microservice
    spec:
      containers:
        - name: identity-microservice
          image: blackpro2k4/identity-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: identity-microservice
  namespace: droniverse-hostname
spec:
  selector:
    app: identity-microservice
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP